<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found · Jiahao Wang</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&amp;family=Lato:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
    <style>
      .not-found {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 30px;
        text-align: center;
      }
      .not-found h1 {
        margin: 0;
        color: var(--accent);
        font-family: var(--serif);
        font-size: clamp(86px, 18vw, 150px);
        font-weight: 600;
        line-height: 0.85;
      }
      .not-found h2 {
        margin: 22px 0 7px;
        font-family: var(--serif);
        font-size: 30px;
      }
      .not-found p {
        margin: 0 0 22px;
        color: var(--muted);
      }
      .not-found a {
        display: inline-block;
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div>
        <p class="eyebrow">Lost in space</p>
        <h1>404</h1>
        <h2>This page does not exist.</h2>
        <p>Let's return to the part of the world we have mapped.</p>
        <a href="./">Back to homepage</a>
      </div>
    </main>
  </body>
</html>
